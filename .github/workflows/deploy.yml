name: Deploy

on:
  repository_dispatch:
    types: [trigger-deploy]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1
      INSTANCE_ID: i-0615c13d31c060a0d
    steps:
      # SSH langsung dari runner GitHub ke tribelio-proxy-service tidak pernah bisa diandalkan
      # (firewall-nya tidak menjangkau IP range runner GitHub, lihat application/tribelio
      # CLAUDE.md). SSM tidak butuh port masuk apa pun -- SSM Agent di instance yang
      # menginisiasi koneksi keluar ke AWS, bukan sebaliknya.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::847969917871:role/gate-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ubuntu/deployment && docker compose pull && docker compose up -d"]' \
            --query "Command.CommandId" --output text)
          echo "CommandId: $COMMAND_ID"

          STATUS="Pending"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Status: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy gagal, status akhir: $STATUS"
            exit 1
          fi
